# Generated-from source. See t01 header. EN canonical, DE translation.
theme_id: 8
slug: "migration-reversibility"
title:
  en: "Migration & Reversibility"
  de: "Migration & Reversibilität"
why:
  en: |
    Every migration path has at least one step from which return is difficult or
    impossible. "Return is impossible" is a valid, documentable answer — pretending
    otherwise creates options that do not exist. This block forces irreversibility to
    be named explicitly.
  de: |
    Jeder Migrationspfad hat mindestens einen Schritt, von dem die Rückkehr schwierig
    oder unmöglich ist. "Rückkehr ist unmöglich" ist eine gültige, dokumentierbare
    Antwort — so zu tun, als wäre es anders, erzeugt Optionen, die nicht existieren.

questions:
  - id: "Q8.1"
    mode: [discovery]
    no_defaults: false
    text:
      en: "What migration paths have been considered — even informally — and what was the reasoning for or against each?"
      de: "Welche Migrationspfade wurden erwogen — auch informell — und was war die Begründung für oder gegen jeden?"
  - id: "Q8.2"
    mode: [triage, discovery]
    no_defaults: true
    text:
      en: "Which steps in any migration path under consideration are irreversible — once taken, the previous state cannot be restored?"
      de: "Welche Schritte in einem erwogenen Migrationspfad sind irreversibel — einmal vollzogen, kann der vorherige Zustand nicht wiederhergestellt werden?"
  - id: "Q8.3"
    mode: [discovery]
    no_defaults: false
    text:
      en: "What approach for running old and new in parallel — if any — has been considered, and for how long?"
      de: "Welcher Ansatz zum parallelen Betrieb von Alt und Neu — falls erwogen — wurde diskutiert, und für wie lange?"
  - id: "Q8.4"
    mode: [discovery]
    no_defaults: false
    text:
      en: "If this migration goes wrong, what is the rollback path — and what does it cost in time and data fidelity?"
      de: "Wenn diese Migration schiefgeht, was ist der Rückweg — und was kostet er an Zeit und Datenintegrität?"
  - id: "Q8.5"
    mode: [discovery]
    no_defaults: true
    text:
      en: "Has the scenario \"return is impossible\" been explicitly evaluated and documented — not just noted as a risk?"
      de: "Wurde das Szenario \"Rückkehr ist unmöglich\" explizit bewertet und dokumentiert — nicht nur als Risiko notiert?"
  - id: "Q8.6"
    mode: [discovery]
    no_defaults: false
    text:
      en: "What data migration strategy exists for master data and historical records — particularly records with retention obligations?"
      de: "Welche Datenmigrationsstrategie gibt es für Stammdaten und historische Datensätze — insbesondere für solche mit Aufbewahrungspflichten?"

hypotheses:
  - name: "The dual-write window is underestimated"
    type: hypothesis
    scope_of_validity: >
      Migrations involving master data with many consumers and no single transactional
      authority.
    falsifiable_by: "A documented load test or proof-of-concept that measured actual synchronisation latency under production-like conditions."
  - name: "Cutover is treated as a technical event, not a business continuity event"
    type: hypothesis
    scope_of_validity: >
      When the cutover plan is owned by engineering with no explicit sign-off from
      operations or the business.
    falsifiable_by: "A cutover plan that names a business-side go/no-go authority and defines rollback trigger criteria in business terms."

red_flags:
  - en: "Irreversible steps are listed as \"risks\" rather than as named, dated decision points."
    de: "Irreversible Schritte stehen als „Risiken“ da statt als benannte, datierte Entscheidungspunkte."
  - en: "Rollback is described as possible but has never been rehearsed."
    de: "Der Rückweg wird als möglich beschrieben, wurde aber nie geprobt."
  - en: "Historical data migration is deferred to \"phase 2\" with no defined phase 2."
    de: "Die Migration historischer Daten wird auf „Phase 2“ verschoben, ohne dass eine Phase 2 definiert wäre."

stop_conditions:
  - en: "If Q8.2 is answered and the irreversible step is the first one → options must explicitly include \"defer decision and complete Discovery\" before the irreversible step is sanctioned."
    de: "Wenn Q8.2 beantwortet ist und der irreversible Schritt der erste ist → die Optionen müssen ausdrücklich „Entscheidung vertagen und Discovery abschließen“ enthalten, bevor der irreversible Schritt freigegeben wird."
