# Generated-from source. See t01 header. EN canonical, DE translation.
theme_id: 3
slug: "constraints-phase"
title:
  en: "Constraints & Phase"
  de: "Vorgaben & Phase"
why:
  en: |
    Fixed constraints collapse the option space before analysis begins. Discovering a
    hard mandate late — a vendor lock-in, a budget ceiling, a regulatory timeline —
    invalidates work already done. This block captures what cannot be changed.
  de: |
    Feste Vorgaben reduzieren den Optionsraum, bevor die Analyse beginnt. Eine spät
    entdeckte harte Vorgabe — ein Vendor-Lock-in, eine Budgetobergrenze, eine
    regulatorische Frist — macht bereits geleistete Arbeit ungültig.

questions:
  - id: "Q3.1"
    mode: [triage, discovery]
    no_defaults: false
    text:
      en: "What architecture or technology mandates are fixed — i.e., not open for discussion in this decision?"
      de: "Welche Architektur- oder Technologievorgaben sind fest — d.h. in dieser Entscheidung nicht zur Diskussion gestellt?"
    hint:
      en: "Data centre, target language, identity provider: whatever is not up for debate."
      de: "Rechenzentrum, Zielsprache, Identitätsanbieter: was nicht zur Debatte steht."
  - id: "Q3.2"
    mode: [discovery]
    no_defaults: true
    text:
      en: "What budget envelope exists for this initiative — or is there none defined?"
      de: "Welchen Budgetrahmen gibt es für diese Initiative — oder ist keiner definiert?"
    hint:
      en: "The budget line, and whether this initiative has its own share of it."
      de: "Die Budgetlinie, und ob diese Initiative einen eigenen Anteil daran hat."
  - id: "Q3.3"
    mode: [discovery]
    no_defaults: false
    text:
      en: "What is the current maturity phase of this platform — how long has it been in production, and what is the cadence of changes?"
      de: "Was ist die aktuelle Reifephase der Plattform — wie lange ist sie in Produktion, und wie häufig wird sie geändert?"
    hint:
      en: "Years in production, releases per year, how many of them are maintenance only."
      de: "Jahre in Produktion, Releases pro Jahr, wie viele davon reine Wartung."
  - id: "Q3.4"
    mode: [discovery]
    no_defaults: true
    text:
      en: "What regulatory or audit commitments constrain the timeline of any change?"
      de: "Welche regulatorischen oder Audit-Verpflichtungen schränken den Zeitplan einer Änderung ein?"
    hint:
      en: "The named regulation, the audit date, and who established both."
      de: "Die benannte Vorschrift, den Prüfungstermin, und wer beides festgestellt hat."
  - id: "Q3.5"
    mode: [discovery]
    no_defaults: false
    text:
      en: "What governance process must any significant platform decision pass through, and how long does it take?"
      de: "Welchen Governance-Prozess muss eine bedeutende Plattformentscheidung durchlaufen, und wie lange dauert er?"
    hint:
      en: "The bodies it passes, the written duration, and the observed one."
      de: "Die Gremien, die vorgeschriebene Dauer, und die erfahrungsgemäße."

hypotheses:
  - name: "Stated mandates are softer than they appear"
    type: hypothesis
    scope_of_validity: >
      When constraints are stated as "we use X" rather than "we must use X per signed
      contract / policy reference N".
    falsifiable_by: "A signed contract clause or a named policy document with the exact requirement."

red_flags:
  - en: "Budget stated as \"TBD\" for a decision with a firm deadline."
    de: "Budget als „TBD“ angegeben, bei gleichzeitig fester Entscheidungsfrist."
  - en: "Mandate attributed to a person rather than a policy or contract."
    de: "Die Vorgabe wird einer Person zugeschrieben statt einer Richtlinie oder einem Vertrag."
  - en: "Governance process timeline is unknown but the decision deadline is fixed."
    de: "Die Dauer des Governance-Verfahrens ist unbekannt, die Entscheidungsfrist steht aber fest."

stop_conditions:
  - en: "None specific; flag for Discovery if regulatory timelines are unknown — Q3.4 is no_defaults: leave blank, mark to-verify."
    de: "Keine spezifische; für Discovery vormerken, wenn regulatorische Fristen unbekannt sind — Q3.4 ist no_defaults: leer lassen, als zu verifizieren markieren."
