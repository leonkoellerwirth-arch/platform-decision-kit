# Generated-from source. See t01 header. EN canonical, DE translation.
theme_id: 10
slug: "operations-security-resilience"
title:
  en: "Operations, Security & Resilience"
  de: "Betrieb, Sicherheit & Resilienz"
why:
  en: |
    A platform that cannot describe its own operational posture cannot safely migrate.
    This block captures the minimum operational and security facts that any migration
    option depends on. If all of Q10.1, Q10.2, Q10.5 and Q10.6 are unknown, the stop
    condition applies.
  de: |
    Eine Plattform, die ihre eigene Betriebslage nicht beschreiben kann, kann nicht
    sicher migrieren. Dieser Block erfasst die minimalen Betriebs- und
    Sicherheitsfakten, von denen jede Migrationsoption abhängt.

questions:
  - id: "Q10.1"
    mode: [triage, discovery]
    no_defaults: true
    text:
      en: "What are the current SLO/availability targets — and are they being met? If no SLO exists, state that explicitly."
      de: "Was sind die aktuellen SLO/Verfügbarkeitsziele — und werden sie eingehalten? Falls kein SLO existiert, explizit benennen."
    hint:
      en: "The SLO if one exists, and the availability actually measured."
      de: "Das SLO, falls es eines gibt, und die tatsächlich gemessene Verfügbarkeit."
  - id: "Q10.2"
    mode: [discovery]
    no_defaults: true
    text:
      en: "What are the RTO and RPO targets — and when was the last restore test conducted?"
      de: "Was sind die RTO- und RPO-Ziele — und wann wurde der letzte Restore-Test durchgeführt?"
    hint:
      en: "RTO and RPO from the plan, and the date of the last restore test."
      de: "RTO und RPO aus dem Konzept, und das Datum des letzten Restore-Tests."
  - id: "Q10.3"
    mode: [discovery]
    no_defaults: false
    text:
      en: "What observability exists — what is logged, what is measured, what triggers an alert?"
      de: "Welche Observability existiert — was wird protokolliert, was gemessen, was löst einen Alert aus?"
    hint:
      en: "What is logged, what is measured, and what raises an alert."
      de: "Was protokolliert, was gemessen wird, und was einen Alert auslöst."
  - id: "Q10.4"
    mode: [discovery]
    no_defaults: false
    text:
      en: "What is the incident response process — and what is the change management process? Are they documented and followed?"
      de: "Was ist der Incident-Response-Prozess — und was ist der Change-Management-Prozess? Sind sie dokumentiert und werden sie eingehalten?"
    hint:
      en: "Whether both are documented, and whether they are followed."
      de: "Ob beide dokumentiert sind, und ob sie eingehalten werden."
  - id: "Q10.5"
    mode: [discovery]
    no_defaults: true
    text:
      en: "Who has access to production systems and data — and is there a documented, reviewed identity and permissions model?"
      de: "Wer hat Zugang zu Produktivsystemen und -daten — und gibt es ein dokumentiertes, geprüftes Identitäts- und Berechtigungsmodell?"
    hint:
      en: "How many people have production access, and when it was last recertified."
      de: "Wie viele Personen produktiven Zugriff haben, und wann zuletzt rezertifiziert wurde."
  - id: "Q10.6"
    mode: [discovery]
    no_defaults: true
    text:
      en: "What encryption is in place at rest and in transit — and are cryptographic keys managed separately from the data they protect?"
      de: "Welche Verschlüsselung ist im Ruhezustand und beim Transport vorhanden — und werden kryptografische Schlüssel separat von den Daten verwaltet, die sie schützen?"
    hint:
      en: "Encryption at rest and in transit, and where the keys are kept."
      de: "Verschlüsselung im Ruhezustand und im Transport, und wo die Schlüssel liegen."

hypotheses:
  - name: "Operational posture was sufficient for the current system but will not transfer"
    type: hypothesis
    scope_of_validity: >
      Migrations that move from a self-managed on-premise system to a managed cloud
      service, or vice versa, where observability and access control models differ
      fundamentally.
    falsifiable_by: "A documented mapping of current operational controls to the target environment."

red_flags:
  - en: "No SLO exists — this is a no_defaults field; state \"none defined\", do not estimate."
    de: "Es existiert kein SLO — ein no_defaults-Feld; „keines definiert“ eintragen, nicht schätzen."
  - en: "Restore has never been tested — RTO/RPO targets are theoretical."
    de: "Ein Restore wurde nie getestet — RTO/RPO-Ziele sind theoretisch."
  - en: "Production access is not inventoried or reviewed regularly."
    de: "Der Produktivzugriff ist nicht inventarisiert und wird nicht regelmäßig geprüft."
  - en: "Encryption at rest or in transit is unknown — leave blank, flag as to-verify."
    de: "Verschlüsselung im Ruhezustand oder beim Transport ist unbekannt — leer lassen, als zu verifizieren markieren."

stop_conditions:
  - en: "If Q10.1, Q10.2, Q10.5 and Q10.6 are all unknown or blank → stop; the operational blind spot must be resolved before any migration option can be evaluated. Document this stop condition in the To-Verify register."
    de: "Wenn Q10.1, Q10.2, Q10.5 und Q10.6 sämtlich unbekannt oder leer sind → Stopp; der betriebliche blinde Fleck muss aufgelöst sein, bevor eine Migrationsoption bewertet werden kann. Diese Stop-Bedingung im To-Verify-Register dokumentieren."
