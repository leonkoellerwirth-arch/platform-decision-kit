# Generated-from source. See t01 header. EN canonical, DE translation.
theme_id: 6
slug: "data-sovereignty"
title:
  en: "Data & Sovereignty"
  de: "Daten & Souveränität"
why:
  en: |
    Data classification determines which options are legally available. Missing
    retention schedules and erasure paths are not implementation details — they are
    blocking constraints that invalidate entire migration options. This block surfaces
    the data layer before options are evaluated.
  de: |
    Die Datenklassifizierung bestimmt, welche Optionen rechtlich verfügbar sind.
    Fehlende Aufbewahrungsfristen und Löschpfade sind keine Implementierungsdetails —
    sie sind blockierende Vorgaben, die ganze Migrationsoptionen ausschließen.

questions:
  - id: "Q6.1"
    mode: [triage, discovery]
    no_defaults: true
    text:
      en: "What data classifications apply to data this platform stores or processes — and who validated that classification?"
      de: "Welche Datenklassifizierungen gelten für Daten, die diese Plattform speichert oder verarbeitet — und wer hat sie validiert?"
    hint:
      en: "The classification, who established it, and when."
      de: "Die Klassifizierung, wer sie festgestellt hat, und wann."
  - id: "Q6.2"
    mode: [discovery]
    no_defaults: true
    text:
      en: "Where does personal data enter the platform, and under what legal basis is it processed?"
      de: "Wo treten personenbezogene Daten in die Plattform ein, und unter welcher Rechtsgrundlage werden sie verarbeitet?"
    hint:
      en: "The entry points, and the legal basis for each of them."
      de: "Die Eintrittspunkte, und die Rechtsgrundlage für jeden davon."
  - id: "Q6.3"
    mode: [discovery]
    no_defaults: true
    text:
      en: "Who is the named data owner for each major data domain processed by this platform?"
      de: "Wer ist der benannte Dateneigner für jede wesentliche Datendomäne, die von dieser Plattform verarbeitet wird?"
    hint:
      en: "One named owner per domain, or the domains that have none."
      de: "Ein benannter Eigner je Domäne, oder die Domänen, die keinen haben."
  - id: "Q6.4"
    mode: [discovery]
    no_defaults: true
    text:
      en: "What are the documented retention requirements, and is there a working erasure path that has been tested?"
      de: "Was sind die dokumentierten Aufbewahrungsanforderungen, und gibt es einen funktionierenden Löschpfad, der getestet wurde?"
    hint:
      en: "The retention period, and whether erasure has ever been tested."
      de: "Die Aufbewahrungsfrist, und ob Löschen je getestet wurde."
  - id: "Q6.5"
    mode: [discovery]
    no_defaults: true
    text:
      en: "Does data processed by this platform cross jurisdictions or leave the organisation's direct control?"
      de: "Überqueren von dieser Plattform verarbeitete Daten Jurisdiktionen oder verlassen sie die direkte Kontrolle der Organisation?"
    hint:
      en: "Where the data sits, the backup route included."
      de: "Wo die Daten liegen, die Backup-Strecke eingeschlossen."

data_inventory_annex:
  type: table
  columns: [domain, classification, owner, retention, erasure_path]
  rows: []

hypotheses:
  - name: "Classification was inherited from the source system, not assessed for the platform"
    type: hypothesis
    scope_of_validity: >
      Migrations where data from multiple source systems is combined in a new context.
    falsifiable_by: "A documented classification review that evaluated the aggregated dataset rather than each source in isolation."
  - name: "The erasure path exists on paper but not in practice"
    type: hypothesis
    scope_of_validity: >
      All platforms that have never received an erasure request.
    falsifiable_by: "A logged, tested end-to-end erasure showing removal across all storage layers."

red_flags:
  - en: "Data classification is \"TBD\" or \"same as source system\" with no documented review."
    de: "Die Datenklassifizierung lautet „TBD“ oder „wie im Quellsystem“, ohne dokumentierte Prüfung."
  - en: "No named data owner for any domain."
    de: "Für keine Domäne ist ein Dateneigner benannt."
  - en: "Retention requirements are unknown — this is a no_defaults field; leave blank, flag to-verify."
    de: "Die Aufbewahrungsanforderungen sind unbekannt — ein no_defaults-Feld; leer lassen, als zu verifizieren markieren."

stop_conditions:
  - en: "If Q6.1, Q6.2 and Q6.4 are all unknown → stop migration options analysis; the data posture must be established before options can be evaluated."
    de: "Wenn Q6.1, Q6.2 und Q6.4 sämtlich unbekannt sind → Analyse der Migrationsoptionen stoppen; die Datenlage muss feststehen, bevor Optionen bewertet werden können."
