# Generated-from source. See t01 header. EN canonical, DE translation.
theme_id: 5
slug: "consumers-interfaces"
title:
  en: "Consumers & Interfaces"
  de: "Konsumenten & Schnittstellen"
why:
  en: |
    A platform migration that breaks a consumer is not a platform migration — it is
    an incident. This block maps who depends on what, which dependencies are formally
    contracted versus informally assumed, and who has the authority to accept a
    breaking change.
  de: |
    Eine Plattformmigration, die einen Konsumenten bricht, ist keine Migration,
    sondern ein Vorfall. Dieser Block bildet ab, wer wovon abhängt, welche
    Abhängigkeiten formal vereinbart und welche informell angenommen sind, und wer
    einer brechenden Änderung zustimmen muss.

questions:
  - id: "Q5.1"
    mode: [discovery]
    no_defaults: false
    text:
      en: "Who are the current consumers of this platform — list them and describe how they integrate (sync, async, batch, event)?"
      de: "Wer sind die aktuellen Konsumenten dieser Plattform — Liste und Beschreibung der Integration (sync, async, Batch, Event)?"
  - id: "Q5.2"
    mode: [triage, discovery]
    no_defaults: false
    text:
      en: "Which consumers are business-critical, and what availability or latency do they require?"
      de: "Welche Konsumenten sind geschäftskritisch, und welche Verfügbarkeit oder Latenz erwarten sie?"
  - id: "Q5.3"
    mode: [discovery]
    no_defaults: false
    text:
      en: "Are there consumers who have built workarounds, undocumented integrations, or shadow copies of platform data?"
      de: "Gibt es Konsumenten, die Workarounds, undokumentierte Integrationen oder Schattenkopien von Plattformdaten angelegt haben?"
  - id: "Q5.4"
    mode: [discovery]
    no_defaults: false
    text:
      en: "Which interfaces are formally contracted or covered by an SLA — and which are informally used?"
      de: "Welche Schnittstellen sind formal vertraglich vereinbart oder durch SLAs abgedeckt — und welche werden informell genutzt?"
  - id: "Q5.5"
    mode: [discovery]
    no_defaults: false
    text:
      en: "Who has the authority to accept a breaking interface change on behalf of each consumer — and is that person reachable?"
      de: "Wer hat die Befugnis, im Namen jedes Konsumenten eine brechende Schnittstellenänderung zu akzeptieren — und ist diese Person erreichbar?"

hypotheses:
  - name: "Informal consumers will surface only when broken"
    type: hypothesis
    scope_of_validity: >
      Platforms older than 3 years in organisations where interface usage is not
      instrumented or logged.
    falsifiable_by: "Complete API access logs showing all callers over a 90-day window."
  - name: "The most critical consumer is not the most vocal one"
    type: hypothesis
    scope_of_validity: >
      When requirements gathering was driven by the loudest team rather than by
      dependency graph analysis.
    falsifiable_by: "A dependency map that ranks consumers by data-flow criticality rather than relationship."

red_flags:
  - en: "Shadow integrations exist that the platform team did not know about."
    de: "Es existieren Schattenintegrationen, von denen das Plattformteam nichts wusste."
  - en: "No one can identify who would approve a breaking change for a given consumer."
    de: "Niemand kann benennen, wer für einen bestimmten Konsumenten einer brechenden Änderung zustimmen würde."
  - en: "SLA commitments are verbal or email-based, not in a signed document."
    de: "SLA-Zusagen bestehen mündlich oder per E-Mail, nicht in einem unterzeichneten Dokument."

stop_conditions:
  - en: "If no consumer inventory exists → treat as a pre-condition for any migration option, not as a Design input."
    de: "Wenn kein Konsumenteninventar existiert → als Vorbedingung jeder Migrationsoption behandeln, nicht als Entwurfseingabe."
