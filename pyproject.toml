[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-decision-kit"
version = "0.1.0"
description = "Generate the triage/discovery intake forms from the canonical theme source, and check agent briefs against the evidence rules."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "setuptools>=83"]

[tool.setuptools]
# The repository is an instrument made of documents, with two small tools beside it;
# there is no installable package.
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
markers = [
    "slow: exercises a real model/LLM; excluded from the gate and CI (run locally with -m slow).",
]
